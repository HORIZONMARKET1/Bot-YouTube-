<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>InstaFlow</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0d1220;--panel:#151c30;--panel2:#1b2440;--line:#26304d;--tx:#e9edf8;--mut:#8b95b1;--acc:#6f7dff;--acc2:#4f5de0;--ok:#35c28b;--warn:#f0b24a;--bad:#ef6a6a;--r:16px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-top:env(safe-area-inset-top)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:92px;resize:vertical}
label.l{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
#app{max-width:560px;margin:0 auto;padding:16px 16px calc(92px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.av{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--acc),#9a6bff);display:grid;place-items:center;font-weight:700;font-size:18px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
header .t{flex:1;min-width:0}
header b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header span{color:var(--mut);font-size:13px}
.badge{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.badge.pro{background:rgba(111,125,255,.16);color:#aab3ff;border-color:rgba(111,125,255,.45)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
h2{font-size:20px;letter-spacing:-.01em;margin:4px 0 12px}
h3{font-size:15px;margin-bottom:4px}
.mut{color:var(--mut);font-size:13px}
.hero{background:linear-gradient(160deg,#1c2650,#151c30 70%);border-color:#2c3866}
.hero .big{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:2px 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid.g2{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--panel2);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:12px;font-weight:600;background:var(--acc);color:#fff;margin-top:8px}
.btn:active{background:var(--acc2)}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--tx)}
.btn.bad{background:rgba(239,106,106,.14);color:#ff9d9d;border:1px solid rgba(239,106,106,.4)}
.btn.sm{width:auto;padding:8px 14px;margin:0;font-size:14px}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-of-type{border-top:0}
.row .ic{width:40px;height:40px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;color:#aab3ff;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px}
.row .tx span{display:block}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.dot.off{background:var(--mut)}
.plan{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;background:var(--panel)}
.plan.pro{border-color:var(--acc);background:linear-gradient(170deg,#1b2350,#151c30)}
.price{font-size:26px;font-weight:700;margin:4px 0 10px}
.price small{font-size:13px;color:var(--mut);font-weight:500}
.plan ul{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:8px}
.plan li{display:flex;gap:10px;align-items:flex-start}
.plan li svg{width:18px;height:18px;color:var(--ok);margin-top:2px}
.plan li.no{color:var(--mut)}.plan li.no svg{color:var(--mut)}
.empty{text-align:center;padding:28px 12px;color:var(--mut)}
.note{background:rgba(240,178,74,.1);border:1px solid rgba(240,178,74,.35);color:#f3cf8c;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.note.ok{background:rgba(53,194,139,.1);border-color:rgba(53,194,139,.4);color:#8be3bd}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(21,28,48,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}
nav .in{display:flex;width:100%;max-width:560px;gap:2px}
nav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:12px;color:var(--mut);font-size:11px;font-weight:600}
nav button.on{color:#c4cbff;background:rgba(111,125,255,.14)}
nav button .pip{position:absolute;top:5px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--panel)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:99;max-width:90%;text-align:center}
.sw{position:relative;width:46px;height:28px;border-radius:999px;background:var(--line);flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{left:21px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:rgba(111,125,255,.2);border-color:var(--acc);color:#dfe3ff}
.pick{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel2);width:100%;text-align:left}
.pick.on{border-color:var(--acc);background:rgba(111,125,255,.14)}
.pick img{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none}
.lock{font-size:12px;color:var(--warn);margin-left:6px}
.back{display:inline-flex;gap:6px;align-items:center;color:#aab3ff;font-weight:600;margin-bottom:10px;padding:4px 0}
.back svg{transform:rotate(180deg);width:18px;height:18px}
.bx{border:1px dashed var(--line);border-radius:12px;padding:10px;margin-top:8px}
.copy{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--panel2);margin-top:8px}
.copy b{font-size:17px;letter-spacing:.04em}
.spark{width:100%;height:90px}
.chips span{display:inline-block;margin:3px 4px 3px 0;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px}
.pimg{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--panel2);flex:none}
/* розыгрыш */
.rf-img{width:100%;border-radius:12px;display:block;margin-bottom:12px;max-height:240px;object-fit:cover}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.chip.open{color:#7be0b5;border-color:rgba(53,194,139,.5);background:rgba(53,194,139,.1)}
.chip.live{color:#ff9d9d;border-color:rgba(239,106,106,.5);background:rgba(239,106,106,.12)}
.rf-prize{display:flex;gap:8px;padding:5px 0}
.tk{display:inline-block;margin:3px 6px 3px 0;padding:5px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:13px}
.tk b{letter-spacing:.08em;color:#c4cbff}
.stage{background:#0a0f1e;border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:12px}
.stage canvas{width:100%;display:block;border-radius:10px}
#plst{text-align:center;min-height:38px;font-size:14px;margin-bottom:6px}
#plst b{color:#c4cbff}
#wn{position:fixed;left:12px;right:12px;top:18%;z-index:20;text-align:center;padding:20px 14px;border-radius:20px;background:linear-gradient(160deg,#2a3680,#151c30);border:1px solid var(--acc);box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .35s ease both}
#wn .m{font-size:46px}#wn .n{font-size:22px;font-weight:700;margin:4px 0}#wn .s{color:#c4cbff;font-size:15px}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.pod .row{border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.card,.plan{animation:up .25s ease both}@keyframes up{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></symbol>
<symbol id="bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
<symbol id="wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/><path d="M6 6l9-3v3"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></symbol>
<symbol id="ig" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
<symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 015 .5c0 1.7-2.5 2-2.5 3.5M12 17h.01"/></symbol>
<symbol id="msg" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
<symbol id="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
<symbol id="gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13"/><path d="M12 8C10 4 6 4.5 6.5 6.5 7 8 12 8 12 8zm0 0c2-4 6-3.5 5.5-1.5C17 8 12 8 12 8z"/></symbol>
<symbol id="chart" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><path d="M8 15l4-4 3 3 5-6"/></symbol>
<symbol id="bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 016 0"/></symbol>
<symbol id="auto" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></symbol>
<symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.2-5 6.5-5s5.7 1.5 6.5 5"/><path d="M16 5a3.5 3.5 0 010 6M18 15c2 .6 3 2 3.5 5"/></symbol>
<symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
<symbol id="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/></symbol>
<symbol id="link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></symbol>
</defs></svg>

<div id="app"></div>
<nav><div class="in" id="nav"></div></nav>

<script>
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#0d1220');tg.setBackgroundColor('#0d1220')}catch(e){}}
const $=s=>document.querySelector(s);
const ic=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const q=new URLSearchParams(location.search);
const user=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{first_name:'',id:0};

/* ---------- состояние ---------- */
const S={tab:'home',stack:[],me:null,auth:true,loaded:false,F:{},P:null,stats:null,rules:null,cat:null,dm:null,media:null,busy:false};
const RF={list:[],loaded:false,open:null,data:null,timing:{batch_ms:1500,fall_ms:3400,hl_ms:3200,win_ms:5500,lead_ms:3000},
 mults:[100,15,10,5,2,5,10,15,100],rows:8,skew:0,run:0,cv:null,raf:null,st:null,playing:false,join:null,auto:null,shown:[]};

function rhead(){const h={'X-Init-Data':tg?tg.initData:''};if(q.get('u')){h['X-Rf-U']=q.get('u');h['X-Rf-S']=q.get('s')||''}return h}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}
async function api(path,o={}){
  const opt={method:o.method||(o.body||o.form?'POST':'GET'),headers:rhead()};
  if(o.form)opt.body=o.form;else if(o.body){opt.body=JSON.stringify(o.body);opt.headers['Content-Type']='application/json'}
  let r,j={};
  try{r=await fetch('/api/'+path,opt)}catch(e){toast('Нет связи с сервером');return{ok:false}}
  try{j=await r.json()}catch(e){j={ok:false}}
  if(r.status===401){S.auth=false;draw();return{ok:false,error:'auth'}}
  if(j.ok===false&&j.msg&&!o.quiet){toast(j.msg);if(j.error==='pro'){S.stack=[];S.tab='plan';draw()}}
  return j;
}
const isPro=()=>S.me&&S.me.tier==='pro';
const fdate=t=>new Date(t*1000).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
const fstart=t=>new Date(t*1000).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
const dleft=t=>Math.max(0,Math.ceil((t*1000-Date.now())/864e5));
const openExt=u=>tg?tg.openLink(u):open(u,'_blank');
const openTg=u=>tg?tg.openTelegramLink(u):open(u,'_blank');
function copy(t){try{navigator.clipboard.writeText(t).then(()=>toast('Скопировано'),fb)}catch(e){fb()}function fb(){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy');toast('Скопировано')}catch(e){}a.remove()}}
function toJpeg(file,max=1280){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej()},'image/jpeg',.85)};im.onerror=rej;im.src=u})}

async function loadMe(){const j=await api('app/me',{quiet:true});if(j.ok){S.me=j;S.auth=true}S.loaded=true;if(!S.stack.length&&!RF.open)draw();return j}

/* ---------- навигация ---------- */
function go(n,p){S.stack.push({n,p});draw();scrollTo(0,0)}
function back(){if(RF.open&&!S.stack.length){rfClose();return}S.stack.pop();draw();scrollTo(0,0)}
function tab(t){if(t!=='raffle')rfStop();S.tab=t;S.stack=[];if(t!=='raffle')RF.open=null;if(t==='rules'&&S.rules===null&&S.me&&S.me.accounts.length)loadRules();draw();scrollTo(0,0);tg&&tg.HapticFeedback&&tg.HapticFeedback.selectionChanged()}
const backBtn=()=>`<button class="back" data-a="back">${ic('chev')}Назад</button>`;
function lockTag(){return isPro()?'':'<span class="lock">🔒 Pro</span>'}
function needPro(){toast('Доступно на Business Pro');S.stack=[];S.tab='plan';draw()}

/* ---------- шапка ---------- */
function head(){
  const m=S.me||{},nm=(m.name||user.first_name||'')+'',ini=esc((nm||'?')[0].toUpperCase());
  return `<header><div class="av">${user.photo_url?`<img src="${esc(user.photo_url)}" alt="">`:ini}</div>
  <div class="t"><b>${esc(nm)||'InstaFlow'}</b><span>${m.username?'@'+esc(m.username):'ID '+(m.uid||user.id||'—')}</span></div>
  <span class="badge ${isPro()?'pro':''}">${isPro()?'Business Pro':'Free'}</span></header>`;
}
const authWarn=()=>`<div class="card empty">Откройте приложение кнопкой из бота (<b>/start</b> → «📲 InstaFlow»), чтобы войти в свой аккаунт.</div>`;
const curAcc=()=>S.me&&S.me.accounts.find(a=>a.selected)||(S.me&&S.me.accounts[0])||null;

/* ---------- главная ---------- */
function viewHome(){
  const m=S.me,a=curAcc(),lv=RF.list.find(r=>r.status==='live');
  const item=(act,icon,t,s,pro)=>`<button class="row" data-a="${act}"><span class="ic">${ic(icon)}</span><span class="tx"><b>${t}${pro?lockTag():''}</b><span class="mut">${s}</span></span>${ic('chev')}</button>`;
  return `${head()}
  ${lv?`<button class="card hero" style="width:100%;text-align:left" data-rf="${esc(lv.id)}"><span class="chip live">● В эфире</span><div class="big" style="font-size:20px;margin-top:8px">${esc(lv.title)}</div><span class="mut">Нажмите, чтобы смотреть розыгрыш</span></button>`:''}
  <div class="card hero"><span class="mut">Подключённый аккаунт</span>
    <div class="big">${a?'@'+esc(a.username):'Instagram не подключён'}</div>
    ${a?`<div class="grid g2"><div class="stat"><b>${m.accounts.length}/${m.max_accounts}</b><span class="mut">аккаунтов</span></div><div class="stat"><b>${isPro()?'Pro':'Free'}</b><span class="mut">${isPro()?'до '+fdate(m.until):(m.free_until?'до '+fdate(m.free_until):'тариф')}</span></div></div>`
    :`<button class="btn" data-a="connect">${ic('ig')}Подключить Instagram</button>`}
  </div>
  <div class="card"><h3>Быстрые действия</h3>
    ${item('newrule','plus','Новая автоматизация','Комментарии, Direct, сторис, меню')}
    ${item('rules','bolt','Мои автоматизации','Включение и статистика')}
    ${item('dm','auto','Автоответчик в Direct','Приветствие и ответ по умолчанию',1)}
    ${item('catalog','bag','Каталог товаров','Карусель с фото и кнопкой «Купить»',1)}
    ${item('stats','chart','Статистика и подписчики','Сообщения, клики, динамика',1)}
    ${item('accounts','users','Аккаунты Instagram','Добавить, выбрать, отключить')}
    ${item('guide','help','Как подготовить аккаунт','Бизнес-профиль и доступ к сообщениям')}
  </div>`;
}

/* ---------- подключение ---------- */
function viewConnect(){
  const m=S.me,lg=m.login,full=m.accounts.length>=m.max_accounts;
  let body='';
  if(full)body=`<div class="card empty">${isPro()?'Достигнут лимит аккаунтов.':'На Free доступен один аккаунт.'}<button class="btn" data-a="plan">${ic('wallet')}Тарифы</button></div>`;
  else if(lg.allowed)body=`<div class="card"><h3>Войти через Instagram</h3><p class="mut" style="margin:6px 0 4px">Откроется Instagram. Войдите, выберите бизнес-портфель и аккаунт (рекламные кабинеты пропустите), нажмите Continue и оставьте все разрешения включёнными. Потом вернитесь сюда.</p>
    ${lg.url?`<button class="btn" data-a="oauth">${ic('ig')}Войти через Instagram</button>`:'<div class="note" style="margin-top:10px">Вход не настроен на сервере (IG_APP_ID, IG_APP_SECRET, WEBAPP_URL).</div>'}
    <button class="btn ghost" data-a="refresh">Я уже вошёл(а) — обновить</button></div>`;
  else if(lg.request==='pending')body=`<div class="card"><h3>⏳ Заявка отправлена</h3><p class="mut" style="margin-top:6px">Это займёт 5–10 минут. Как только админ подтвердит, здесь появится кнопка входа.</p><button class="btn ghost" data-a="refresh">Обновить</button></div>`;
  else body=`<div class="card"><h3>📝 Заявка на подключение</h3><p class="mut" style="margin:6px 0 4px">Вход через Instagram открывается по заявкам. Введите логин вашего Instagram — аккаунт должен быть профессиональным (бизнес или автор).</p>

function spark(rows){
  if(rows.length<2)return '';
  const v=rows.map(r=>r.cnt),mn=Math.min(...v),mx=Math.max(...v),W=300,H=80,sp=mx-mn||1;
  const pts=v.map((y,i)=>`${(i/(v.length-1))*W},${H-8-((y-mn)/sp)*(H-16)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#8d98ff" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}

async function rfLoad(){

  if(r.ok){RF.list=r.raffles;RF.timing=r.timing;RF.mults=r.mults;RF.rows=r.rows;RF.skew=r.now*1000-Date.now();RF.loaded=true;

    if(lv&&RF.auto!==lv.id&&!RF.playing){RF.auto=lv.id;rfOpen(lv.id,true);toast('🎬 Розыгрыш начался!');return}
    if(S.tab==='raffle'&&!RF.open||S.tab==='home'&&!S.stack.length)draw()}

async function rfOpen(id,auto){
  const r=await api('raffle/'+id,{quiet:true});
  if(!r.ok){toast('Не удалось загрузить розыгрыш');return}
  RF.data=r.raffle;RF.timing=r.timing;RF.mults=r.mults;RF.rows=r.rows;RF.skew=r.now*1000-Date.now();
  rfStop();RF.open=id;RF.join=null;S.stack=[];S.tab='raffle';draw();scrollTo(0,0);
  if(auto&&(RF.data.status==='live'||RF.data.status==='finished'))rfPlay(false);
}

/* ---- Plinko ---- */
const PW=360,PR=11,SEG=340;
function geo(){const rows=RF.rows,dx=(PW-24)/(rows+1),cx=PW/2,y0=62,dy=30,yb=y0+rows*dy+8;return{rows,dx,cx,y0,dy,yb,H:yb+58}}
function rfMount(){
  const c=$('#pl');if(!c||!RF.data||!RF.data.result&&RF.data.status!=='open'){RF.cv=null;return}
  if(!c)return;
  const g=geo(),dpr=Math.min(2,window.devicePixelRatio||1);
  c.width=PW*dpr;c.height=g.H*dpr;c.style.aspectRatio=PW+'/'+g.H;RF.cv=c;RF.dpr=dpr;
  if(!RF.st)RF.st={balls:[],counts:Array(g.rows+1).fill(0),hl:[]};
  const fin=RF.data.status==='finished'&&!RF.playing;
  rfPodium(fin?RF.data.result.winners:RF.shown);
  if(!RF.playing)rfStatus(fin?'Розыгрыш завершён. Победители ниже 👇':'Эфир идёт — нажмите «Смотреть»');
  if(!RF.raf)RF.raf=requestAnimationFrame(tick);
}
function rfStatus(h){const e=$('#plst');if(e)e.innerHTML=h}
function rfPodium(w){const e=$('#podium');if(!e)return;
  e.innerHTML='<h3>Победители</h3>'+(w&&w.length?w.map(x=>`<div class="row"><span class="ic">${MEDAL(x.place)}</span><span class="tx"><b>${esc(x.name)}</b><span class="mut">${x.place} место · билет №${x.n}${x.mult?' · '+x.mult+'x':''}</span></span></div>`).join(''):'<div class="mut">Победители появятся здесь по ходу эфира</div>')}
function mkBall(n,bits,t0){
  const g=geo(),pts=[{x:g.cx,y:g.y0-44},{x:g.cx,y:g.y0-PR-3}];let rights=0;
  for(let r=0;r<g.rows;r++){rights+=+bits[r];const x=g.cx+(rights-(r+1)/2)*g.dx;pts.push({x,y:r+1<g.rows?g.y0+(r+1)*g.dy-PR-3:g.yb+26})}
  return{n,t0,pts,b:rights,landed:false}
}
function ballPos(b,now){
  const e=now-b.t0;if(e<0)return null;const k=Math.floor(e/SEG);
  if(k>=b.pts.length-1)return b.pts[b.pts.length-1];
  const t=(e-k*SEG)/SEG,a=b.pts[k],c=b.pts[k+1];const ez=t*t*(3-2*t);
  return{x:a.x+(c.x-a.x)*ez,y:a.y+(c.y-a.y)*(k===0?t*t:t)-(k>=1&&k<b.pts.length-2?9*Math.sin(Math.PI*t):0)}
}
function tick(now){
  if(!RF.cv||!document.body.contains(RF.cv)){RF.raf=null;return}
  const c=RF.cv,x=c.getContext('2d'),g=geo(),st=RF.st,d=RF.dpr;
  x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,PW,g.H);
  for(let r=0;r<g.rows;r++)for(let k=0;k<r+3;k++){x.beginPath();x.arc(g.cx+(k-(r+2)/2)*g.dx,g.y0+r*g.dy,3,0,7);x.fillStyle='#7c88ad';x.fill()}
  for(let i=0;i<=g.rows;i++){
    const m=RF.mults[i],bx=g.cx+(i-g.rows/2)*g.dx-g.dx/2+1,w=g.dx-2,hl=st.hl.includes(i);
    x.fillStyle=MC[m]||'#6f7dff';x.globalAlpha=hl?1:.78;x.beginPath();x.roundRect?x.roundRect(bx,g.yb,w,34,8):x.rect(bx,g.yb,w,34);x.fill();x.globalAlpha=1;
    if(hl){x.lineWidth=3;x.strokeStyle='#fff';x.stroke()}
    x.fillStyle='#fff';x.font='700 13px sans-serif';x.textAlign='center';x.fillText(m+'x',bx+w/2,g.yb+21);
    if(st.counts[i]){x.fillStyle='#c4cbff';x.font='600 11px sans-serif';x.fillText('×'+st.counts[i],bx+w/2,g.yb+50)}
  }
  for(const b of st.balls){
    if(b.landed)continue;const p=ballPos(b,now);if(!p)continue;
    if(now-b.t0>=SEG*(b.pts.length-1)){b.landed=true;st.counts[b.b]++;continue}
    x.beginPath();x.arc(p.x,p.y,PR,0,7);x.fillStyle=`hsl(${(b.n*47)%360} 70% 55%)`;x.fill();x.lineWidth=1.5;x.strokeStyle='rgba(255,255,255,.7)';x.stroke();
    x.fillStyle='#fff';x.font=`700 ${String(b.n).length>3?8:10}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(b.n,p.x,p.y+.5);x.textBaseline='alphabetic'
  }
  RF.raf=requestAnimationFrame(tick);
}
/* Эфир идёт по серверным часам: каждое событие имеет время `at` (мс от старта). Опоздавший зритель подхватывает с текущего момента. */
async function rfPlay(replay){
  const r0=RF.data;if(!r0||!r0.result||RF.playing)return;
  const my=++RF.run,T=RF.timing,g=geo();RF.playing=true;RF.shown=[];
  const live=()=>my===RF.run&&!!$('#pl');
  const isLive=!replay&&r0.status==='live';
  const t0=isLive?Date.now()-r0.result.elapsed_ms:Date.now()+1200,clk=()=>Date.now()-t0;
  RF.st={balls:[],counts:Array(g.rows+1).fill(0),hl:[]};let cur=[];
  const pb=$('[data-a=rfplay]');if(pb)pb.textContent='…';rfPodium([]);
  rfStatus('🎬 Розыгрыш начинается…');
  let evs=r0.result.events,i=0,dur=r0.result.duration_ms||0;
  for(;;){
    if(!live())return;
    const e=evs[i];
    if(!e){
      if(isLive){await sleep(1500);if(!live())return;
        const j=await api('raffle/'+RF.open,{quiet:true});if(!j.ok)continue;
        RF.data=j.raffle;evs=j.raffle.result.events;dur=j.raffle.result.duration_ms||dur;
        if(j.raffle.status==='finished'&&i>=evs.length)break;continue}
      break;
    }
    const wait=e.at-clk();
    if(wait>40){await sleep(Math.min(wait,1500));continue}
    i++;
    const st=RF.st,late=clk()-e.at;
    if(e.t==='round'){st.balls=[];st.counts=Array(g.rows+1).fill(0);st.hl=[];cur=[];rfStatus(`<b>${esc(e.label)}</b><br><span class="mut">Шариков: ${e.total}</span>`)}
    else if(e.t==='drop'){e.balls.forEach((x,k)=>{const b=mkBall(x[0],x[1],performance.now()-late+k*110);st.balls.push(b);cur.push(b)})}
    else if(e.t==='hl'){
      if(cur.length){const top=Math.max(...cur.map(x=>RF.mults[x.b])),tb=cur.filter(x=>RF.mults[x.b]===top);
        st.hl=[...new Set(tb.map(x=>x.b))];
        rfStatus(`Лучшая корзина <b>${top}x</b>: ${tb.slice(0,12).map(x=>'№'+x.n).join(', ')}${tb.length>12?'…':''}`)}}
    else if(e.t==='win'){
      RF.shown.push(e);rfPodium(RF.shown);
      const rem=T.win_ms-late;
      if(rem>800){const w=document.createElement('div');w.id='wn';
        w.innerHTML=`<div class="m">${MEDAL(e.place)}</div><div class="n">${esc(e.name)}</div><div class="s">${e.place} место · билет №${e.n}${e.mult?' · '+e.mult+'x':''}</div>`;
        document.body.append(w);tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('success');setTimeout(()=>w.remove(),rem)}
    }
  }
  const left=dur-clk();if(left>0)await sleep(left);
  if(my!==RF.run)return;
  RF.playing=false;if(RF.st)RF.st.hl=[];rfStatus('🏁 Розыгрыш завершён. Победителям бот отправил сообщение.');
  const pb2=$('[data-a=rfplay]');if(pb2)pb2.textContent='▶ Смотреть повтор';
  if(RF.data.status==='live')await rfOpen(RF.open,false);
}

    if(f&&f.files[0]){try{fd.append('photo',await toJpeg(f.files[0],1080),'p.jpg')}catch(e){toast('Не удалось обработать фото');return}}
    const j=await api('app/catalog',{form:fd});if(j.ok){S.cat=j.products;S.F.prod={title:'',sub:'',url:'',btn:''};toast('✅ Товар добавлен');draw()}},
  pdel:async(el)=>{const j=await api('app/catalog',{body:{act:'delete',id:+el.dataset.id}});if(j.ok){S.cat=j.products;draw()}},
  buy:async(el)=>{const j=await api('app/pay/start',{body:{plan:el.dataset.id}});if(j.ok){S.P={kind:'plan',amount:j.amount,dc:j.dc,alif:j.alif,title:'Business Pro · '+j.label};tab('plan')}},
  paycancel:async()=>{if(S.P&&S.P.kind==='plan'){await api('app/pay/cancel',{body:{}});S.P=null;await loadMe()}else{RF.pay=null}draw()},
  sendrcpt:async()=>{const P=S.P&&!S.P.done&&S.tab==='plan'&&!RF.open?S.P:RF.pay,f=$('#rfile');if(!f||!f.files[0]){toast('Прикрепите фото чека');return}
    if(S.busy)return;S.busy=true;let blob;try{blob=await toJpeg(f.files[0],1280)}catch(e){S.busy=false;toast('Не удалось обработать фото');return}
    const fd=new FormData();fd.append('file',blob,'receipt.jpg');
    const j=await api(P.kind==='plan'?'app/pay/receipt':'raffle/receipt',{form:fd});S.busy=false;
    if(j.ok){toast('✅ Чек отправлен');P.sent=1;if(P.kind==='plan'){await loadMe()}draw();watchPay()}},
  copy:(el)=>copy(el.dataset.v),
  support:()=>openTg(S.me.support),
  opench:(el)=>openTg(el.dataset.u),
  rfjoin:rfJoin,rfbuy:rfBuy,
  rfplay:()=>{if(!RF.playing)rfPlay(RF.data.status!=='live')},
  claim:async()=>{const j=await api('raffle/claim',{body:{code:S.F.claim||''}});if(j.msg)toast(j.msg);if(j.ok){await loadMe()}},
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-tab],[data-a],[data-rf]');if(!b)return;
  if(b.dataset.tab){tab(b.dataset.tab);return}
  if(b.dataset.rf!==undefined){rfOpen(b.dataset.rf,false);return}
  const f=A[b.dataset.a];if(f)f(b);
});
async function pollConnect(){
  for(let i=0;i<40;i++){await sleep(4000);const n=S.me?S.me.accounts.length:0;
    const top=S.stack[S.stack.length-1];if(!top||top.n!=='connect')return;
    await loadMe();
    if(S.me.accounts.length>n){toast('✅ Instagram подключён!');S.stack=[];S.tab='home';draw();return}
    if(S.me.login.allowed&&i%5===0)draw()}
}
async function watchPay(){
  for(let i=0;i<120;i++){await sleep(8000);const was=S.me&&S.me.tier;await loadMe();
    if(S.me&&S.me.tier==='pro'&&was!=='pro'){toast('✅ Business Pro подключён!');S.P=null;draw();return}
    if(S.me&&!S.me.pending&&S.P&&S.P.sent){S.P=null;draw();return}
    if(RF.open){await rfRefresh();if(RF.data&&RF.data.mine.length&&RF.pay&&RF.pay.sent){RF.pay=null;RF.join=null;toast('🎟 Билет выдан!');draw();return}}}
}

/* ---------- старт ---------- */
(async()=>{
  draw();
  await loadMe();
  rfLoad();
  setInterval(()=>{if(!document.hidden)rfLoad()},12000);
  if(q.get('rf')){rfOpen(q.get('rf'),true)}
  if(S.me&&S.me.pending&&S.me.pending.status==='review'){S.P=null}
  draw();
})();
</script>
